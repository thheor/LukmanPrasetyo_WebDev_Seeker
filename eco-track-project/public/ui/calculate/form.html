<form
  id="form"
  class="max-sm:w-[90%] sm:col-start-2 col-span-10 sm:col-span-5 sm:row-start-5 h-fit row-span-3 sm:row-span-8 flex flex-col gap-2 sm:gap-5 max-sm:h-fit"
>
  <!-- TRANSPORTATION -->
  <div
    class="flex justify-center items-center max-sm:h-fit bg-frost border border-moss/20 rounded-xl"
  >
    <div class="relative flex flex-col justify-center gap-2 w-[90%] py-5">
      <legend
        class="flex gap-2 items-center text-deep-forest text-lg sm:text-2xl font-medium"
      >
        <span class="p-1 bg-moss rounded">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fbf6f6"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-bus-front-icon lucide-bus-front"
          >
            <path d="M4 6 2 7" />
            <path d="M10 6h4" />
            <path d="m22 7-2-1" />
            <rect width="16" height="16" x="4" y="3" rx="2" />
            <path d="M4 11h16" />
            <path d="M8 15h.01" />
            <path d="M16 15h.01" />
            <path d="M6 19v2" />
            <path d="M18 21v-2" />
          </svg>
        </span>
        Transportation
      </legend>

      <label for="jarak" class="text-xs sm:text-base text-Black font-normal"
        >DISTANCE TRAVELED (KM)</label
      >
      <div>
        <input
          type="text"
          id="jarak"
          name="jarak"
          value=""
          placeholder="Enter distance"
          class="font-inter text-lg w-full bg-cream px-2 py-1 border border-moss/20 rounded-lg focus:outline-0"
        />
        <p
          id="jarak-error"
          class="hidden first-letter:uppercase font-inter text-xs sm:text-sm mt-1 text-scarlet"
        >
          Enter a valid positif distance.
        </p>
      </div>

      <legend class="max-sm:text-xs text-Black font-inter">VEHICLE TYPE</legend>
      <div class="grid grid-cols-2 gap-2 h-fit">
        <div class="w-full h-full">
          <input
            type="radio"
            id="motor"
            name="kendaraan"
            value="motor"
            class="sr-only peer"
          />
          <label
            for="motor"
            class="radio-label inline-flex justify-center items-center gap-2 text-lg text-moss font-inter cursor-pointer w-full py-1.5 border border-moss/60 rounded-lg bg-cream peer-checked:bg-moss peer-checked:text-cream hover:bg-moss hover:text-cream transition duration-200 ease-in-out"
          >
            <span
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-motorbike-icon lucide-motorbike"
              >
                <path d="m18 14-1-3" />
                <path d="m3 9 6 2a2 2 0 0 1 2-2h2a2 2 0 0 1 1.99 1.81" />
                <path
                  d="M8 17h3a1 1 0 0 0 1-1 6 6 0 0 1 6-6 1 1 0 0 0 1-1v-.75A5 5 0 0 0 17 5"
                />
                <circle cx="19" cy="17" r="3" />
                <circle cx="5" cy="17" r="3" /></svg
            ></span>
            Motor
          </label>
        </div>
        <div class="w-full h-full">
          <input
            type="radio"
            id="mobil"
            name="kendaraan"
            value="mobil"
            class="sr-only peer"
          />
          <label
            for="mobil"
            class="radio-label inline-flex justify-center items-center gap-2 text-lg text-moss font-inter cursor-pointer w-full py-1.5 border border-moss/60 rounded-lg bg-cream peer-checked:bg-moss peer-checked:text-cream hover:bg-moss hover:text-cream transition duration-200 ease-in-out"
          >
            <span
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-car-icon lucide-car"
              >
                <path
                  d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"
                />
                <circle cx="7" cy="17" r="2" />
                <path d="M9 17h6" />
                <circle cx="17" cy="17" r="2" /></svg
            ></span>
            Mobil
          </label>
        </div>
        <p
          id="kendaraan-error"
          class="hidden font-inter first-letter:uppercase text-xs sm:text-sm text-scarlet -mt-1"
        >
          Enter a valid vehicle.
        </p>
      </div>
    </div>
  </div>
  <!-- ENERGY USAGE -->
  <div class="">
    <div
      class="h-full flex py-5 justify-center items-center bg-frost border border-moss/20 rounded-xl"
    >
      <div class="flex flex-col justify-center gap-2 w-[90%] h-[90%]">
        <legend
          class="flex gap-2 items-center text-deep-forest text-2xl font-medium"
        >
          <span class="p-1 bg-deep-forest rounded"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fbf6f6"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-zap-icon lucide-zap"
            >
              <path
                d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"
              /></svg
          ></span>
          Energy Usage
        </legend>
        <div class="inline-flex gap-2">
          <div class="w-full">
            <label for="durasi_ac" class="max-sm:text-xs text-Black font-inter"
              >AC HOURS / DAY</label
            >
            <input
              type="text"
              id="durasi_ac"
              name="durasi_ac"
              value=""
              placeholder="0"
              class="max-sm:place-self-end font-inter text-lg w-full bg-cream px-2 py-1 border border-moss/20 rounded-lg focus:outline-0"
            />
            <p
              id="durasi_ac-error"
              class="hidden font-inter first-letter:uppercase text-xs sm:text-sm text-scarlet max-sm:mt-1"
            >
              Durasi AC should not be more than 24.
            </p>
          </div>
          <div class="w-full">
            <label
              for="durasi_laptop"
              class="max-sm:text-xs text-Black font-inter"
              >LAPTOP HOURS / DAY</label
            >
            <input
              type="text"
              id="durasi_laptop"
              name="durasi_laptop"
              value=""
              placeholder="0"
              class="font-inter text-lg w-full bg-cream px-2 py-1 border border-moss/20 rounded-lg focus:outline-0"
            />
            <p
              id="durasi_laptop-error"
              class="hidden font-inter first-letter:uppercase text-xs sm:text-sm text-scarlet max-sm:mt-1"
            >
              Enter a valid laptop duration.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- SUBMIT & RESET -->
  <div class="max-sm:h-fit sm:mb-5">
    <div class="flex gap-4 items-center">
      <button
        type="submit"
        id="submit-button"
        class="inline-flex items-center justify-center px-6 py-2 text-lg font-inter font-medium border border-moss/80 bg-moss/80 text-cream hover:bg-moss hover:border-moss/80 rounded-full cursor-pointer"
      >
        Calculate
        <span class="ml-2"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-trending-up-icon lucide-trending-up"
          >
            <path d="M16 7h6v6" />
            <path d="m22 7-8.5 8.5-5-5L2 17" /></svg
        ></span>
      </button>
      <button
        type="reset"
        id="reset-button"
        class="inline-flex items-center justify-center px-6 py-2 text-lg font-inter font-medium border border-moss text-Black/80 hover:bg-sage/20 rounded-full cursor-pointer"
      >
        <span class="mr-2"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" /></svg
        ></span>
        Reset
      </button>
    </div>
  </div>
</form>
